[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-project"
version = "0.1.0"
description = "Personalised glucose prediction — iAUC XGBoost pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.4.0",
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "optuna==4.3.0",
    "pandas==3.0.1",
    "scipy==1.17.0",
    "scikit-learn==1.8.0",
    "seaborn==0.13.2",
    "shap==0.51.0",
    "xgboost==3.2.0",
]

[project.scripts]
rp-train = "research_project.training.train:main"
rp-plots = "research_project.training.plots:main"
rp-shap-report = "research_project.analysis.shap_analysis:main"
rp-realign = "research_project.data_pipeline.realign:main"
rp-build-realigned-source = "research_project.data_pipeline.build_realigned_source:main"
rp-build-feature-matrix = "research_project.data_pipeline.feature_matrix:main"

[tool.setuptools.packages.find]
where = ["src"]

# Help the IDE resolve `import research_project` without relying only on editable installs.
[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.10"
